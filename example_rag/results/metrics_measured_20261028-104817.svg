<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 885 828" width="885" height="828" role="img" aria-label="Metrics reported by each tool in one run">
<style>:root{--bg:#fbfaf8;--fg:#1d2328;--muted:#5d666d;--line:#d9d6cf;--obs:#1f6f8b;--ev:#b4582a;--obsf:#dcebf0;--evf:#f4e3d8;--empty:#efede8}
